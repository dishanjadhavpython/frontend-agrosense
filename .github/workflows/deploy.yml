# Build, test and ship AgroSense to AWS on every push to main.
#
#   test ──────────────┐
#   prepare ── build ──┴── deploy
#   (ECR)     (4 ARM64      (terraform apply with the new image tags,
#              images)       wait for ECS, smoke-test the live site)
#
# No AWS key is stored in GitHub. Each job that touches AWS runs in the `dev`
# environment and exchanges GitHub's OIDC token for the deploy role, which
# trusts only this repository's `dev` environment (terraform/bootstrap).
#
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   AWS_DEPLOY_ROLE_ARN   from `terraform -chdir=terraform/bootstrap output`
#   TF_STATE_BUCKET       idem
#   BUILD_INPUTS_BUCKET   idem — the trained models and the engine's data
#   CLERK_PUBLISHABLE_KEY pk_… (public by design: it ships in the browser bundle)

name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "images/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# One deployment at a time, and never cancel one half-way through an apply.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TF_VAR_clerk_publishable_key: ${{ vars.CLERK_PUBLISHABLE_KEY }}

jobs:
  test:
    name: Reading-service tests
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch the trained models
        run: aws s3 sync "s3://${{ vars.BUILD_INPUTS_BUCKET }}/ML/models" ML/models --only-show-errors

      - name: Tesseract (English + Marathi)
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-eng tesseract-ocr-mar

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # The same order as backend/Dockerfile: CPU torch first, so the
      # requirements file cannot pull a CUDA build.
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r backend/requirements.txt pytest

      # The job holds AWS credentials (for the models), so the research agents
      # would otherwise switch themselves on and spend Bedrock calls in a test.
      - name: Test
        env:
          AGROSENSE_AGENTS_ENABLED: "0"
        run: python -m pytest backend/tests -q -p no:cacheprovider

  prepare:
    name: Image repositories
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform
        run: >-
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=agrosense/${{ env.ENVIRONMENT }}/terraform.tfstate"
          -backend-config="region=${{ env.AWS_REGION }}"
          -backend-config="use_lockfile=true"
          -backend-config="encrypt=true"

      # The Lambda cannot be created before its image exists, and the services
      # would only crash-loop, so on a first deploy the repositories come first.
      # On every later run this is a no-op.
      - name: Create the ECR repositories
        working-directory: terraform
        run: >-
          terraform apply -auto-approve -var-file=envs/${{ env.ENVIRONMENT }}.tfvars
          -target=module.api.aws_ecr_repository.this
          -target=module.engine.aws_ecr_repository.this
          -target=module.web.aws_ecr_repository.this
          -target=module.agents.aws_ecr_repository.agents

  build:
    name: Image — ${{ matrix.service }}
    needs: prepare
    runs-on: ubuntu-24.04-arm     # the tasks run on ARM64 Graviton; build natively
    environment: dev
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: .
            file: backend/Dockerfile
          - service: agents
            context: .
            file: backend/Dockerfile.agents
          - service: web
            context: .
            file: Dockerfile.web
          - service: engine
            context: ml engine for Recommendation
            file: ml engine for Recommendation/Dockerfile
    steps:
      # The engine is its own repository, linked here as a submodule.
      - uses: actions/checkout@v4
        with:
          submodules: ${{ matrix.service == 'engine' }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      - name: Fetch the trained models
        if: matrix.service == 'api'
        run: aws s3 sync "s3://${{ vars.BUILD_INPUTS_BUCKET }}/ML/models" ML/models --only-show-errors

      - name: Fetch the engine's data
        if: matrix.service == 'engine'
        run: |
          aws s3 sync "s3://${{ vars.BUILD_INPUTS_BUCKET }}/engine/data" "ml engine for Recommendation/data" --only-show-errors
          aws s3 sync "s3://${{ vars.BUILD_INPUTS_BUCKET }}/engine/artifacts" "ml engine for Recommendation/artifacts" --only-show-errors

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: true
          # Lambda accepts a plain image manifest only, not the index that
          # provenance and SBOM attestations wrap around it.
          provenance: false
          sbom: false
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.CLERK_PUBLISHABLE_KEY }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/agrosense-${{ env.ENVIRONMENT }}-${{ matrix.service }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/agrosense-${{ env.ENVIRONMENT }}-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Terraform apply and roll out
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 75
    env:
      TF_VAR_backend_image_tag: ${{ github.sha }}
      TF_VAR_engine_image_tag: ${{ github.sha }}
      TF_VAR_web_image_tag: ${{ github.sha }}
      TF_VAR_agents_image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform
        run: >-
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=agrosense/${{ env.ENVIRONMENT }}/terraform.tfstate"
          -backend-config="region=${{ env.AWS_REGION }}"
          -backend-config="use_lockfile=true"
          -backend-config="encrypt=true"

      - name: Terraform plan
        working-directory: terraform
        run: terraform plan -var-file=envs/${{ env.ENVIRONMENT }}.tfvars -out=tfplan -no-color | tail -n 40

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Wait for the services
        working-directory: terraform
        run: |
          cluster=$(terraform output -raw ecs_cluster)
          services=$(terraform output -json ecs_services | jq -r '.[]' | tr '\n' ' ')
          aws ecs wait services-stable --cluster "$cluster" --services $services

      - name: Smoke test
        working-directory: terraform
        run: |
          site=$(terraform output -raw site_url)
          echo "Site: $site"
          # A new CloudFront distribution takes a few minutes to answer.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$site/api/health" || true)
            [ "$code" = 200 ] && break
            sleep 15
          done
          [ "$code" = 200 ] || { echo "web /api/health answered $code"; exit 1; }
          # Through the web app to the engine, over Service Connect.
          meta=$(curl -s -o /dev/null -w '%{http_code}' "$site/api/recommend/meta")
          [ "$meta" = 200 ] || { echo "/api/recommend/meta answered $meta"; exit 1; }
          # The origin itself must refuse anything that did not come through CloudFront.
          origin=$(curl -s -o /dev/null -w '%{http_code}' "http://$(terraform output -raw alb_dns_name)/api/health")
          [ "$origin" = 403 ] || { echo "load balancer answered $origin without the origin header"; exit 1; }
          echo "### Deployed $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$site" >> "$GITHUB_STEP_SUMMARY"
